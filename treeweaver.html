<body>

<div id="hint">Press Play to relax the layout &middot; tune Repulsion/Attraction &middot; drag a node to pin it &middot; drag the background to pan &middot; scroll to zoom &middot; hover for details</div>

<div id="tooltip"></div>
<script>
const DATA = {"nodes": [], "edges": [], "collapse": 0.0, "mstAlgo": "prim", "layoutMode": "spring", "prefix": "treeweaver"};
const NS = "http://www.w3.org/2000/svg";
const W = 1000, H = 1000;
const svg = document.getElementById("graph");
svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
const gRoot = document.createElementNS(NS, "g");
svg.appendChild(gRoot);
const edgeLayer = document.createElementNS(NS, "g");
const nodeLayer = document.createElementNS(NS, "g");
gRoot.appendChild(edgeLayer);
gRoot.appendChild(nodeLayer);

// ---- embedded data (optional; can be replaced by an uploaded matrix) ----
let N = DATA.n || 0;
let PREFIX = DATA.prefix || "mst";
let LABELS = DATA.labels || [];
let MATRIX = DATA.matrix || [];
function snp(i, j) { return MATRIX[i * N + j]; }

const state = {
  collapse: DATA.collapse,
  mstAlgo: DATA.mstAlgo,
  layoutMode: DATA.layoutMode,
  repulsion: 10.0,
  attraction: 0.1,
  speed: 10,
  bounded: false,
  labelScale: 1.0,
  nodeScale: 1.0,
  edgeFont: 11,
  edgeWidth: 1.2,
};

let nodes = [];
let edges = [];
let byId = {};
let initial = [];
let nodeObjs = [];
let edgeObjs = [];

// ---- metadata ----
const META = { columns: [], bySample: new Map() };  // bySample: label -> {col: value}
const metaState = { col: "", mode: "pie", mixedColor: "#8a8a8a" };
let catColors = new Map();   // category -> color (for the active column)
const NA_COLOR = "#d9d9d9";  // samples without a metadata value

function parseMetadata(text) {
  const lines = text.split(/\r?\n/).filter(l => l.trim() !== "");
  if (lines.length < 2) throw new Error("metadata table has too few lines");
  const delim = lines[0].includes("\t") ? "\t" : ",";
  const header = lines[0].split(delim).map(s => s.trim());
  if (header.length < 2) throw new Error("metadata table needs a sample column plus at least one metadata column");
  const columns = header.slice(1);
  const bySample = new Map();
  for (let r = 1; r < lines.length; r++) {
    const fields = lines[r].split(delim);
    const name = String(fields[0] || "").trim();
    if (!name) continue;
    const rec = {};
    columns.forEach((col, i) => { rec[col] = String(fields[i + 1] == null ? "" : fields[i + 1]).trim(); });
    bySample.set(name, rec);
  }
  if (bySample.size === 0) throw new Error("no sample rows found in metadata table");
  return { columns, bySample };
}

// Assign a stable distinct color to each category of the active column,
// ordered by first appearance in the matrix labels for reproducibility.
function computeCategoryColors() {
  catColors = new Map();
  if (!metaState.col) return;
  const cats = [];
  const seen = new Set();
  for (let i = 0; i < N; i++) {
    const rec = META.bySample.get(LABELS[i]);
    const v = (rec && rec[metaState.col] !== "") ? rec[metaState.col] : null;
    if (v !== null && !seen.has(v)) { seen.add(v); cats.push(v); }
  }
  const palette = distinctColors(cats.length);
  cats.forEach((c, i) => catColors.set(c, palette[i]));
}

// Compute per-node metadata counts and the fill (solid color or pie slices).
function computeNodeColors() {
  nodes.forEach(n => { n.pie = null; n.metaCounts = null; });
  if (!metaState.col || META.bySample.size === 0) return;
  for (const n of nodes) {
    const counts = new Map();
    for (const i of n.membersIdx) {
      const rec = META.bySample.get(LABELS[i]);
      const v = (rec && rec[metaState.col] !== "" && rec[metaState.col] != null) ? rec[metaState.col] : null;
      const key = v === null ? "(no data)" : v;
      counts.set(key, (counts.get(key) || 0) + 1);
    }
    n.metaCounts = counts;
    const catColor = (cat) => cat === "(no data)" ? NA_COLOR : catColors.get(cat);
    if (counts.size === 1) {
      n.color = catColor([...counts.keys()][0]);
    } else if (metaState.mode === "pie") {
      n.pie = [...counts.entries()]
        .sort((a, b) => b[1] - a[1] || (a[0] < b[0] ? -1 : 1))
        .map(([cat, cnt]) => ({ cat, frac: cnt / n.count, color: catColor(cat) }));
      n.color = metaState.mixedColor; // fallback (e.g. label contrast, PDF stroke)
    } else {
      n.color = metaState.mixedColor;
    }
  }
}

// ---- MST algorithms ----
// Tie-breaking is based on sample LABELS (not matrix indices), so the same
// underlying samples resolve equal-weight ties identically no matter how the
// matrix is ordered or subsampled. All three algorithms use the same rule:
// among equal weights, prefer the edge whose endpoint labels are
// lexicographically smallest.
function labelCmp(a, b) { return a < b ? -1 : a > b ? 1 : 0; }
// Canonical (order-independent) tie key for an edge between samples i and j.
function edgeTieKey(i, j) {
  const a = LABELS[i], b = LABELS[j];
  return a < b ? a + "" + b : b + "" + a;
}

function mstPrim() {
  const inTree = new Uint8Array(N);
  const best = new Float64Array(N).fill(Infinity);
  const parent = new Int32Array(N).fill(-1);
  // Start from the sample with the smallest label (stable across subsampling).
  let start = 0;
  for (let i = 1; i < N; i++) if (LABELS[i] < LABELS[start]) start = i;
  best[start] = 0;
  const out = [];
  for (let it = 0; it < N; it++) {
    let u = -1;
    for (let i = 0; i < N; i++) {
      if (inTree[i]) continue;
      if (u === -1 || best[i] < best[u] ||
          (best[i] === best[u] && labelCmp(LABELS[i], LABELS[u]) < 0)) u = i;
    }
    if (u === -1) break;
    inTree[u] = 1;
    if (parent[u] !== -1) out.push({ s: parent[u], t: u, w: snp(parent[u], u) });
    for (let v = 0; v < N; v++) {
      if (inTree[v]) continue;
      const w = snp(u, v);
      if (w < best[v] ||
          (w === best[v] && parent[v] !== -1 && labelCmp(LABELS[u], LABELS[parent[v]]) < 0)) {
        best[v] = w; parent[v] = u;
      }
    }
  }
  return out;
}

function mstKruskal() {
  const all = [];
  for (let i = 0; i < N; i++) for (let j = i + 1; j < N; j++) all.push([snp(i, j), i, j]);
  // Sort by weight, then by endpoint labels, so ties break identically
  // regardless of matrix row order.
  all.sort((a, b) => a[0] - b[0] ||
    labelCmp(LABELS[a[1]], LABELS[b[1]]) || labelCmp(LABELS[a[2]], LABELS[b[2]]));
  const parent = new Int32Array(N);
  for (let i = 0; i < N; i++) parent[i] = i;
  function find(x) { while (parent[x] !== x) { parent[x] = parent[parent[x]]; x = parent[x]; } return x; }
  const out = [];
  for (const [w, i, j] of all) {
    const ri = find(i), rj = find(j);
    if (ri !== rj) { parent[ri] = rj; out.push({ s: i, t: j, w }); if (out.length === N - 1) break; }
  }
  return out;
}

function mstBoruvka() {
  const parent = new Int32Array(N);
  for (let i = 0; i < N; i++) parent[i] = i;
  function find(x) { while (parent[x] !== x) { parent[x] = parent[parent[x]]; x = parent[x]; } return x; }
  const out = [];
  let components = N;
  while (components > 1) {
    const cheapestFrom = new Int32Array(N).fill(-1);
    const cheapestTo = new Int32Array(N).fill(-1);
    const cheapestW = new Float64Array(N).fill(Infinity);
    for (let i = 0; i < N; i++) {
      const ri = find(i);
      for (let j = 0; j < N; j++) {
        if (i === j || find(j) === ri) continue;
        const w = snp(i, j);
        if (w < cheapestW[ri] ||
            (w === cheapestW[ri] &&
             edgeTieKey(i, j) < edgeTieKey(cheapestFrom[ri], cheapestTo[ri]))) {
          cheapestW[ri] = w; cheapestFrom[ri] = i; cheapestTo[ri] = j;
        }
      }
    }
    let merged = 0;
    for (let r = 0; r < N; r++) {
      if (cheapestFrom[r] !== -1) {
        const i = cheapestFrom[r], j = cheapestTo[r];
        const ri = find(i), rj = find(j);
        if (ri !== rj) {
          parent[ri] = rj;
          out.push({ s: i, t: j, w: snp(i, j) });
          merged++; components--;
        }
      }
    }
    if (merged === 0) break;
  }
  return out;
}

function computeMST() {
  if (state.mstAlgo === "kruskal") return mstKruskal();
  if (state.mstAlgo === "boruvka") return mstBoruvka();
  return mstPrim();
}

// ---- collapse ----
function computeComponents(threshold) {
  const parent = new Int32Array(N);
  for (let i = 0; i < N; i++) parent[i] = i;
  function find(x) { while (parent[x] !== x) { parent[x] = parent[parent[x]]; x = parent[x]; } return x; }
  for (let i = 0; i < N; i++) {
    for (let j = i + 1; j < N; j++) {
      if (snp(i, j) <= threshold) { const ri = find(i), rj = find(j); if (ri !== rj) parent[ri] = rj; }
    }
  }
  const compId = new Int32Array(N);
  const index = new Map();
  const members = [];
  for (let i = 0; i < N; i++) {
    const r = find(i);
    if (!index.has(r)) { index.set(r, members.length); members.push([]); }
    const c = index.get(r);
    compId[i] = c;
    members[c].push(i);
  }
  return { compId, members };
}

function collapseEdges(mst, compId) {
  const seen = new Map();
  for (const e of mst) {
    const a = compId[e.s], b = compId[e.t];
    if (a === b) continue;
    const key = a < b ? a + "," + b : b + "," + a;
    const cur = seen.get(key);
    if (!cur || e.w < cur.w) seen.set(key, { s: Math.min(a, b), t: Math.max(a, b), w: e.w });
  }
  return [...seen.values()];
}

// ---- colors ----
function hsvToHex(h, s, v) {
  const c = v * s, x = c * (1 - Math.abs((h * 6) % 2 - 1)), m = v - c;
  const hh = Math.floor(h * 6) % 6;
  let r, g, b;
  if (hh === 0) { r = c; g = x; b = 0; }
  else if (hh === 1) { r = x; g = c; b = 0; }
  else if (hh === 2) { r = 0; g = c; b = x; }
  else if (hh === 3) { r = 0; g = x; b = c; }
  else if (hh === 4) { r = x; g = 0; b = c; }
  else { r = c; g = 0; b = x; }
  const to = (val) => Math.round((val + m) * 255).toString(16).padStart(2, "0");
  return "#" + to(r) + to(g) + to(b);
}
function distinctColors(n) {
  const out = [];
  for (let i = 0; i < n; i++) {
    const hue = (i * 0.618033988749895) % 1;
    const sat = 0.55 + 0.25 * ((i % 3) / 2);
    const val = 0.85 - 0.15 * (i % 2);
    out.push(hsvToHex(hue, sat, val));
  }
  return out;
}

// ---- layout ----
function layoutSpring(iterations, attractionMul) {
  const n = nodes.length;
  if (n < 2) return;
  const ideal = 700 / Math.sqrt(n);
  const repulsion = ideal * ideal * state.repulsion;
  const attraction = state.attraction * (attractionMul || 1);
  const rest = edges.map(e => ideal * (1 + 0.5 * Math.log1p(e.w)));
  let temp = 70;
  const cooling = 0.995;
  for (let it = 0; it < iterations; it++) {
    const dx = new Float64Array(n), dy = new Float64Array(n);
    for (let i = 0; i < n; i++) {
      for (let j = i + 1; j < n; j++) {
        const ddx = nodes[i].x - nodes[j].x, ddy = nodes[i].y - nodes[j].y;
        const d = Math.hypot(ddx, ddy) || 1e-4;
        const f = repulsion / (d * d);
        const ux = ddx / d, uy = ddy / d;
        dx[i] += f * ux; dy[i] += f * uy; dx[j] -= f * ux; dy[j] -= f * uy;
      }
    }
    edges.forEach((e, idx) => {
      const a = nodes[e.s], b = nodes[e.t];
      const ddx = a.x - b.x, ddy = a.y - b.y;
      const d = Math.hypot(ddx, ddy) || 1e-4;
      const f = attraction * (d - rest[idx]);
      const ux = ddx / d, uy = ddy / d;
      dx[a.id] -= f * ux; dy[a.id] -= f * uy; dx[b.id] += f * ux; dy[b.id] += f * uy;
    });
    for (let i = 0; i < n; i++) {
      const m = Math.hypot(dx[i], dy[i]) || 1e-9;
      const step = Math.min(m, temp);
      nodes[i].x += dx[i] / m * step; nodes[i].y += dy[i] / m * step;
    }
    temp *= cooling;
  }
}

function layoutSnp(iterations) {
  const n = nodes.length;
  if (n < 2) return;
  const ideal = 700 / Math.sqrt(n);
  const repulsion = ideal * ideal * state.repulsion;
  // Stronger springs + a wider rest-length range in this mode so that edge
  // lengths visibly track SNP distance instead of being set by repulsion alone.
  const attraction = state.attraction * 3.0;
  const rest = edges.map(e => ideal * (1 + 2 * Math.log1p(e.w)));
  const cd = [];
  let sum = 0, cnt = 0;
  for (let a = 0; a < n; a++) {
    cd.push(new Float64Array(n));
    for (let b = 0; b < n; b++) {
      if (a === b) continue;
      let best = Infinity;
      for (const i of nodes[a].membersIdx) for (const j of nodes[b].membersIdx) { const w = snp(i, j); if (w < best) best = w; }
      cd[a][b] = best;
      if (best > 0) { sum += best; cnt++; }
    }
  }
  const mean = cnt ? sum / cnt : 1;
  let temp = 70;
  const cooling = 0.995;
  for (let it = 0; it < iterations; it++) {
    const dx = new Float64Array(n), dy = new Float64Array(n);
    for (let i = 0; i < n; i++) {
      for (let j = i + 1; j < n; j++) {
        const ddx = nodes[i].x - nodes[j].x, ddy = nodes[i].y - nodes[j].y;
        const d = Math.hypot(ddx, ddy) || 1e-4;
        const f = repulsion / (d * d) * (1 + cd[i][j] / mean);
        const ux = ddx / d, uy = ddy / d;
        dx[i] += f * ux; dy[i] += f * uy; dx[j] -= f * ux; dy[j] -= f * uy;
      }
    }
    edges.forEach((e, idx) => {
      const a = nodes[e.s], b = nodes[e.t];
      const ddx = a.x - b.x, ddy = a.y - b.y;
      const d = Math.hypot(ddx, ddy) || 1e-4;
      const f = attraction * (d - rest[idx]);
      const ux = ddx / d, uy = ddy / d;
      dx[a.id] -= f * ux; dy[a.id] -= f * uy; dx[b.id] += f * ux; dy[b.id] += f * uy;
    });
    for (let i = 0; i < n; i++) {
      const m = Math.hypot(dx[i], dy[i]) || 1e-9;
      const step = Math.min(m, temp);
      nodes[i].x += dx[i] / m * step; nodes[i].y += dy[i] / m * step;
    }
    temp *= cooling;
  }
}

function layoutStress(iterations) {
  const n = nodes.length;
  if (n < 2) return;
  const adj = Array.from({ length: n }, () => []);
  for (const e of edges) {
    const lw = Math.log1p(e.w) + 0.5;
    adj[e.s].push([e.t, lw]); adj[e.t].push([e.s, lw]);
  }
  const D = [];
  for (let s = 0; s < n; s++) {
    const dist = new Float64Array(n).fill(Infinity); dist[s] = 0;
    const done = new Uint8Array(n);
    for (let it = 0; it < n; it++) {
      let u = -1, bv = Infinity;
      for (let i = 0; i < n; i++) if (!done[i] && dist[i] < bv) { bv = dist[i]; u = i; }
      if (u === -1) break;
      done[u] = 1;
      for (const [v, w] of adj[u]) if (dist[u] + w < dist[v]) dist[v] = dist[u] + w;
    }
    D.push(dist);
  }
  const K = [];
  for (let i = 0; i < n; i++) {
    K.push(new Float64Array(n));
    for (let j = 0; j < n; j++) K[i][j] = (i !== j && D[i][j] > 0) ? 1 / (D[i][j] * D[i][j]) : 0;
  }
  const L = 1.0;
  for (let i = 0; i < n; i++) { const a = 2 * Math.PI * i / n; nodes[i].x = Math.cos(a); nodes[i].y = Math.sin(a); }
  for (let it = 0; it < iterations; it++) {
    let maxDelta = 0;
    for (let i = 0; i < n; i++) {
      let numx = 0, numy = 0, den = 0;
      for (let j = 0; j < n; j++) {
        if (i === j) continue;
        const ddx = nodes[i].x - nodes[j].x, ddy = nodes[i].y - nodes[j].y;
        const d = Math.hypot(ddx, ddy) || 1e-9;
        const kij = K[i][j];
        numx += kij * (nodes[j].x + L * D[i][j] * ddx / d);
        numy += kij * (nodes[j].y + L * D[i][j] * ddy / d);
        den += kij;
      }
      if (den > 0) {
        const nx = numx / den, ny = numy / den;
        maxDelta = Math.max(maxDelta, Math.hypot(nx - nodes[i].x, ny - nodes[i].y));
        nodes[i].x = nx; nodes[i].y = ny;
      }
    }
    if (maxDelta < 1e-4) break;
  }
}

function layoutInitial() {
  nodes.forEach(n => { n.x = Math.random() * 1000; n.y = Math.random() * 1000; });
  if (state.layoutMode === "stress") layoutStress(300);
  else if (state.layoutMode === "snp") layoutSnp(600);
  else if (state.layoutMode === "stiff") layoutSpring(600, 3.0);
  else layoutSpring(600, 1.0);
}

function normalize() {
  const xs = nodes.map(n => n.x), ys = nodes.map(n => n.y);
  const minX = Math.min(...xs), maxX = Math.max(...xs);
  const minY = Math.min(...ys), maxY = Math.max(...ys);
  const span = Math.max(maxX - minX, maxY - minY) || 1;
  const pad = 60;
  const s = (W - 2 * pad) / span;
  nodes.forEach(n => { n.x = pad + (n.x - minX) * s; n.y = pad + (n.y - minY) * s; });
}

// ---- build graph ----
function buildGraph() {
  const mst = computeMST();
  const { compId, members } = computeComponents(state.collapse);
  const cedges = collapseEdges(mst, compId);
  const colors = distinctColors(members.length);
  const counts = members.map(m => m.length);
  const maxCount = Math.max(...counts);
  const rScale = 1000 * 0.07 / (0.6 + Math.sqrt(maxCount));
  nodes = members.map((mem, c) => {
    const count = mem.length;
    const names = mem.map(i => LABELS[i]).sort();
    const label = count === 1 ? names[0] : names[0] + " (+" + (count - 1) + ")";
    const membersStr = names.slice(0, 8).join(", ") + (count > 8 ? " ..." : "");
    const rBase = rScale * (0.6 + Math.sqrt(count));
    return {
      id: c, count, label, members: membersStr, membersIdx: mem,
      color: colors[c], rBase,
      r: rBase * state.nodeScale,
      x: 0, y: 0, pinned: false,
    };
  });
  edges = cedges.map(e => ({ s: e.s, t: e.t, w: e.w }));
  byId = {};
  nodes.forEach(n => { byId[n.id] = n; });
  computeCategoryColors();
  computeNodeColors();
  layoutInitial();
  normalize();
  initial = nodes.map(n => ({ x: n.x, y: n.y }));
  render();
}

// ---- render ----
// SVG path for a pie wedge of radius r from angle a0 to a1 (radians, y-down screen space).
function wedgeEl(r, a0, a1, color) {
  const x0 = r * Math.cos(a0), y0 = r * Math.sin(a0);
  const x1 = r * Math.cos(a1), y1 = r * Math.sin(a1);
  const large = (a1 - a0) > Math.PI ? 1 : 0;
  const p = document.createElementNS(NS, "path");
  p.setAttribute("d", `M0 0 L${x0.toFixed(3)} ${y0.toFixed(3)} A${r} ${r} 0 ${large} 1 ${x1.toFixed(3)} ${y1.toFixed(3)} Z`);
  p.setAttribute("fill", color);
  return p;
}

function render() {
  while (edgeLayer.firstChild) edgeLayer.removeChild(edgeLayer.firstChild);
  while (nodeLayer.firstChild) nodeLayer.removeChild(nodeLayer.firstChild);
  edgeObjs = [];
  nodeObjs = [];
  for (const e of edges) {
    const line = document.createElementNS(NS, "line");
    line.setAttribute("stroke", "#7a7a7a");
    line.setAttribute("stroke-width", state.edgeWidth);
    edgeLayer.appendChild(line);
    const label = document.createElementNS(NS, "text");
    label.setAttribute("font-size", state.edgeFont);
    label.setAttribute("fill", "#333333");
    label.setAttribute("text-anchor", "middle");
    label.setAttribute("dominant-baseline", "middle");
    label.textContent = e.w;
    edgeLayer.appendChild(label);
    edgeObjs.push({ e, line, label });
  }
  for (const n of nodes) {
    const grp = document.createElementNS(NS, "g");
    nodeLayer.appendChild(grp);
    const c = document.createElementNS(NS, "circle");
    c.setAttribute("r", n.r);
    if (n.pie && n.pie.length > 1) {
      // Pie node: one wedge per category, plus a full-circle outline on top.
      let a0 = -Math.PI / 2;
      for (const s of n.pie) {
        const a1 = a0 + s.frac * 2 * Math.PI;
        grp.appendChild(wedgeEl(n.r, a0, a1 - 1e-9, s.color));
        a0 = a1;
      }
      c.setAttribute("fill", "none");
      c.setAttribute("stroke", "black");
      c.setAttribute("stroke-width", "0.8");
      grp.appendChild(c);
    } else {
      c.setAttribute("fill", n.color);
      c.setAttribute("stroke", "black");
      c.setAttribute("stroke-width", "0.8");
      grp.appendChild(c);
    }
    grp.style.cursor = "grab";
    const t = document.createElementNS(NS, "text");
    t.setAttribute("text-anchor", "middle");
    t.setAttribute("dominant-baseline", "middle");
    t.setAttribute("font-size", Math.max(8, Math.min(15, n.r * 0.55)) * state.labelScale);
    t.setAttribute("pointer-events", "none");
    t.textContent = n.label;
    nodeLayer.appendChild(t);
    const o = { n, grp, c, t };
    nodeObjs.push(o);
    grp.addEventListener("pointerdown", ev => {
      ev.stopPropagation();
      ev.preventDefault();
      drag = o;
      o.n.pinned = true;
      const p = clientToGraph(ev);
      dragOffset = { x: o.n.x - p.x, y: o.n.y - p.y };
      grp.setPointerCapture(ev.pointerId);
      grp.style.cursor = "grabbing";
    });
    grp.addEventListener("mouseenter", ev => {
      clearTimeout(hideTimer);
      hoverNode = o;
      let extra = "";
      if (o.n.metaCounts) {
        extra = "<br><b>" + metaState.col + ":</b> " +
          [...o.n.metaCounts.entries()].map(([cat, cnt]) => `${cat} (${cnt})`).join(", ");
      }
      tip.innerHTML = `<b>${o.n.label}</b><br>samples: ${o.n.count}<br>${o.n.members}${extra}` +
        `<div><button data-act="samples">Download samples</button>` +
        `<button data-act="matrix">Download matrix</button></div>`;
      tip.style.display = "block";
      positionTip(ev);
    });
    grp.addEventListener("mousemove", ev => { if (hoverNode === o) positionTip(ev); });
    grp.addEventListener("mouseleave", () => {
      hideTimer = setTimeout(() => { tip.style.display = "none"; }, 350);
    });
  }
  redraw();
}

function redraw() {
  edgeObjs.forEach(o => {
    const a = byId[o.e.s], b = byId[o.e.t];
    o.line.setAttribute("x1", a.x); o.line.setAttribute("y1", a.y);
    o.line.setAttribute("x2", b.x); o.line.setAttribute("y2", b.y);
    o.label.setAttribute("x", (a.x + b.x) / 2);
    o.label.setAttribute("y", (a.y + b.y) / 2);
  });
  nodeObjs.forEach(o => {
    o.grp.setAttribute("transform", `translate(${o.n.x},${o.n.y})`);
    o.t.setAttribute("x", o.n.x); o.t.setAttribute("y", o.n.y);
  });
}

// Apply the font-size / edge-width controls without rebuilding the graph.
function applyStyle() {
  edgeObjs.forEach(o => {
    o.line.setAttribute("stroke-width", state.edgeWidth);
    o.label.setAttribute("font-size", state.edgeFont);
  });
  nodeObjs.forEach(o => {
    o.t.setAttribute("font-size", Math.max(8, Math.min(15, o.n.r * 0.55)) * state.labelScale);
  });
}

let k = 1, tx = 0, ty = 0;
let drag = null, dragOffset = { x: 0, y: 0 };
let panning = false, panStart = { x: 0, y: 0 };

function applyTransform() {
  gRoot.setAttribute("transform", `translate(${tx},${ty}) scale(${k})`);
}

// Convert a client (screen) point into the graph's local coordinate space,
// correctly accounting for the pan/zoom transform and the viewBox scaling.
function clientToGraph(ev) {
  const pt = svg.createSVGPoint();
  pt.x = ev.clientX;
  pt.y = ev.clientY;
  const local = pt.matrixTransform(gRoot.getScreenCTM().inverse());
  return { x: local.x, y: local.y };
}

// Convert a client point into the untransformed viewBox space (for zooming).
function clientToViewBox(ev) {
  const pt = svg.createSVGPoint();
  pt.x = ev.clientX;
  pt.y = ev.clientY;
  const local = pt.matrixTransform(svg.getScreenCTM().inverse());
  return { x: local.x, y: local.y };
}

svg.addEventListener("wheel", ev => {
  ev.preventDefault();
  const p = clientToViewBox(ev);
  const factor = ev.deltaY < 0 ? 1.15 : 1 / 1.15;
  const nk = Math.max(0.01, Math.min(25, k * factor));
  tx = p.x - (p.x - tx) * (nk / k);
  ty = p.y - (p.y - ty) * (nk / k);
  k = nk;
  applyTransform();
}, { passive: false });

svg.addEventListener("pointerdown", ev => {
  panning = true;
  panStart = { x: ev.clientX, y: ev.clientY };
});

window.addEventListener("pointermove", ev => {
  if (drag) {
    const p = clientToGraph(ev);
    drag.n.x = p.x + dragOffset.x;
    drag.n.y = p.y + dragOffset.y;
    redraw();
  } else if (panning) {
    const rect = svg.getBoundingClientRect();
    tx += (ev.clientX - panStart.x) / rect.width * W;
    ty += (ev.clientY - panStart.y) / rect.height * H;
    panStart = { x: ev.clientX, y: ev.clientY };
    applyTransform();
  }
});

window.addEventListener("pointerup", () => {
  if (drag) { drag.n.pinned = false; drag.grp.style.cursor = "grab"; drag = null; }
  panning = false;
});

const tip = document.getElementById("tooltip");
let hoverNode = null;
let hideTimer = null;

function positionTip(ev) {
  tip.style.left = (ev.clientX + 14) + "px";
  tip.style.top = (ev.clientY + 14) + "px";
}
function safeName(s) {
  return s.replace(/[^A-Za-z0-9._-]+/g, "_").replace(/_+/g, "_").replace(/^_+|_+$/g, "").slice(0, 60);
}
function downloadSamples(o) {
  const names = o.n.membersIdx.map(i => LABELS[i]);
  downloadBlob(new Blob([names.join("\n") + "\n"], { type: "text/plain" }),
    PREFIX + "_" + safeName(o.n.label) + "_samples.txt");
}
function downloadMatrix(o) {
  const idx = o.n.membersIdx;
  const lines = ["	" + idx.map(i => LABELS[i]).join("	")];
  for (const i of idx) lines.push(LABELS[i] + "	" + idx.map(j => snp(i, j)).join("	"));
  downloadBlob(new Blob([lines.join("\n") + "\n"], { type: "text/tab-separated-values" }),
    PREFIX + "_" + safeName(o.n.label) + "_matrix.tsv");
}
tip.addEventListener("mouseenter", () => clearTimeout(hideTimer));
tip.addEventListener("mouseleave", () => { tip.style.display = "none"; });
tip.addEventListener("click", ev => {
  const act = ev.target && ev.target.dataset ? ev.target.dataset.act : null;
  if (!act || !hoverNode) return;
  if (act === "samples") downloadSamples(hoverNode);
  else if (act === "matrix") downloadMatrix(hoverNode);
});

// ---- live simulation ----
let playing = false;
let snpMean = 1;

function snpDist(a, b) {
  let best = Infinity;
  for (const i of nodes[a].membersIdx) for (const j of nodes[b].membersIdx) { const w = snp(i, j); if (w < best) best = w; }
  return best;
}
function computeSnpMean() {
  let sum = 0, cnt = 0;
  for (let a = 0; a < nodes.length; a++) for (let b = a + 1; b < nodes.length; b++) {
    const w = snpDist(a, b);
    if (w > 0) { sum += w; cnt++; }
  }
  snpMean = cnt ? sum / cnt : 1;
}

function layoutStep(temp) {
  if (state.layoutMode === "stress") { layoutStress(1); return; }
  const n = nodes.length;
  if (n < 2) return;
  const ideal = 700 / Math.sqrt(n);
  const repulsion = ideal * ideal * state.repulsion;
  const useSnp = state.layoutMode === "snp";
  const attraction = state.attraction * ((state.layoutMode === "stiff" || useSnp) ? 3.0 : 1.0);
  const dx = new Float64Array(n);
  const dy = new Float64Array(n);
  for (let i = 0; i < n; i++) {
    for (let j = i + 1; j < n; j++) {
      let ddx = nodes[i].x - nodes[j].x;
      let ddy = nodes[i].y - nodes[j].y;
      let d = Math.sqrt(ddx * ddx + ddy * ddy);
      if (d < 1e-4) {
        ddx = Math.random() - 0.5;
        ddy = Math.random() - 0.5;
        d = Math.hypot(ddx, ddy) || 1e-4;
      }
      let f = repulsion / (d * d);
      if (useSnp) f *= (1 + snpDist(i, j) / snpMean);
      const ux = ddx / d, uy = ddy / d;
      dx[i] += f * ux; dy[i] += f * uy;
      dx[j] -= f * ux; dy[j] -= f * uy;
    }
  }
  for (const e of edges) {
    const a = nodes[e.s], b = nodes[e.t];
    const ddx = a.x - b.x, ddy = a.y - b.y;
    const d = Math.sqrt(ddx * ddx + ddy * ddy) || 1e-4;
    const rest = ideal * (1 + (useSnp ? 2 : 0.5) * Math.log1p(e.w));
    const f = attraction * (d - rest);
    const ux = ddx / d, uy = ddy / d;
    dx[a.id] -= f * ux; dy[a.id] -= f * uy;
    dx[b.id] += f * ux; dy[b.id] += f * uy;
  }
  if (state.bounded) {
    const margin = 40;
    for (let i = 0; i < n; i++) {
      const nd = nodes[i];
      if (nd.x < margin) dx[i] += (margin - nd.x);
      if (nd.x > W - margin) dx[i] -= (nd.x - (W - margin));
      if (nd.y < margin) dy[i] += (margin - nd.y);
      if (nd.y > H - margin) dy[i] -= (nd.y - (H - margin));
    }
  }
  for (let i = 0; i < n; i++) {
    if (nodes[i].pinned) continue;
    const m = Math.hypot(dx[i], dy[i]);
    if (m < 1e-9) continue;
    const step = Math.min(m, temp);
    nodes[i].x += dx[i] / m * step;
    nodes[i].y += dy[i] / m * step;
  }
}

function loop() {
  if (!playing) return;
  for (let s = 0; s < state.speed; s++) layoutStep(5);
  redraw();
  requestAnimationFrame(loop);
}

const playButton = document.getElementById("play");
playButton.onclick = () => {
  playing = !playing;
  playButton.textContent = playing ? "⏸ Pause" : "▶ Play";
  playButton.classList.toggle("active", playing);
  if (playing) requestAnimationFrame(loop);
};

function startPlay() {
  if (playing) return;
  playing = true;
  playButton.textContent = "⏸ Pause";
  playButton.classList.add("active");
  requestAnimationFrame(loop);
}

document.getElementById("reset").onclick = () => {
  playing = false;
  playButton.textContent = "▶ Play";
  playButton.classList.remove("active");
  nodes.forEach((n, i) => { n.x = initial[i].x; n.y = initial[i].y; });
  redraw();
};

// ---- export (SVG / PNG / PDF) ----

// Legend contents for image exports, rebuilt from the same data buildLegend()
// uses (totals per category, NA color for missing values, mixed-mode row).
// Returns null when no legend would be shown on screen.
function legendData() {
  if (!metaState.col || META.bySample.size === 0) return null;
  const totals = new Map();
  for (let i = 0; i < N; i++) {
    const rec = META.bySample.get(LABELS[i]);
    const v = (rec && rec[metaState.col] !== "" && rec[metaState.col] != null) ? rec[metaState.col] : "(no data)";
    totals.set(v, (totals.get(v) || 0) + 1);
  }
  const rows = [...totals.entries()]
    .sort((a, b) => b[1] - a[1] || (a[0] < b[0] ? -1 : 1))
    .map(([cat, cnt]) => ({
      color: cat === "(no data)" ? NA_COLOR : catColors.get(cat),
      label: cat + " (" + cnt + ")",
    }));
  if (metaState.mode === "mixed") rows.push({ color: metaState.mixedColor, label: "(mixed)" });
  return { title: metaState.col, rows };
}

// Shared legend layout in generic font-size units: a white rounded card at
// the top-right with a bold title and one swatch+label row per category.
function legendMetrics(ld) {
  const font = 13;
  let wText = ld.title.length * font * 0.62;
  for (const r of ld.rows) wText = Math.max(wText, r.label.length * font * 0.62);
  return { font, rowH: 18, w: 12 + 18 + wText + 8, h: 12 + 16 + ld.rows.length * 18 };
}

// Extend the exported SVG's canvas to the full image size. The live SVG's
// viewBox is a 1000x1000 square that gets letterboxed inside the on-screen
// canvas (width/height = the window size), so the legend must be drawn at the
// image's right edge, not the tree square's. The extended viewBox maps the
// tree to exactly the same pixels as before (centered “meet”). Returns the
// px-per-viewBox-unit scale, or null when no legend is shown (then the
// export stays byte-identical to before).
function prepareExportCanvas(el) {
  if (legendEl.style.display === "none") return null;
  if (!legendData()) return null;
  const w = parseFloat(el.getAttribute("width")) || W;
  const h = parseFloat(el.getAttribute("height")) || H;
  const scale = Math.min(w / W, h / H) || 1;
  const vw = w / scale, vh = h / scale;
  el.setAttribute("viewBox", `${(-(vw - W) / 2).toFixed(2)} ${(-(vh - H) / 2).toFixed(2)} ${vw.toFixed(2)} ${vh.toFixed(2)}`);
  el.setAttribute("preserveAspectRatio", "none");
  return scale;
}

// Append the legend to an exported SVG clone (used by both SVG and PNG
// exports). Respects the on-screen visibility toggle; the HTML export draws
// its own interactive legend, so it does not call this. `scale` is the
// px-per-viewBox-unit factor from prepareExportCanvas.
function addExportLegend(el, scale) {
  if (!scale) return;
  const ld = legendData();
  if (!ld) return;
  const m = legendMetrics(ld);
  const w = parseFloat(el.getAttribute("width")) || W;
  const pad = 16 / scale;
  const gx = (w / scale) / 2 + W / 2 - m.w - pad;   // right edge of the canvas
  const gy = 16 / scale;
  const g = document.createElementNS(NS, "g");
  const bg = document.createElementNS(NS, "rect");
  bg.setAttribute("x", gx); bg.setAttribute("y", gy);
  bg.setAttribute("width", m.w); bg.setAttribute("height", m.h);
  bg.setAttribute("rx", 6);
  bg.setAttribute("fill", "rgba(255,255,255,0.95)");
  bg.setAttribute("stroke", "#bbbbbb");
  g.appendChild(bg);
  const title = document.createElementNS(NS, "text");
  title.setAttribute("x", gx + 12); title.setAttribute("y", gy + 12 + 11);
  title.setAttribute("font-size", m.font); title.setAttribute("font-weight", "bold");
  title.setAttribute("fill", "#222222");
  title.textContent = ld.title;
  g.appendChild(title);
  ld.rows.forEach((r, i) => {
    const cy = gy + 12 + 16 + 3 + i * m.rowH;
    const c = document.createElementNS(NS, "circle");
    c.setAttribute("cx", gx + 12 + 6); c.setAttribute("cy", cy);
    c.setAttribute("r", 5.5); c.setAttribute("fill", r.color);
    c.setAttribute("stroke", "#555555");
    g.appendChild(c);
    const t = document.createElementNS(NS, "text");
    t.setAttribute("x", gx + 12 + 18); t.setAttribute("y", cy + 4);
    t.setAttribute("font-size", 12); t.setAttribute("fill", "#333333");
    t.textContent = r.label;
    g.appendChild(t);
  });
  el.appendChild(g);
}

function downloadBlob(blob, name) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
}

// Size of the on-screen canvas, so exports match the current view.
function viewSize() {
  const rect = svg.getBoundingClientRect();
  return { w: Math.max(1, Math.round(rect.width || W)), h: Math.max(1, Math.round(rect.height || H)) };
}

// Clone the live SVG (which carries the current pan/zoom transform) at the
// on-screen size, so the export captures exactly what is displayed.
function cloneView() {
  const clone = svg.cloneNode(true);
  clone.setAttribute("xmlns", NS);
  const size = viewSize();
  clone.setAttribute("width", size.w);
  clone.setAttribute("height", size.h);
  return clone;
}

function exportSVG() {
  const clone = cloneView();
  addExportLegend(clone, prepareExportCanvas(clone));
  downloadBlob(new Blob([clone.outerHTML], { type: "image/svg+xml" }), PREFIX + ".svg");
}

function exportPNG() {
  const size = viewSize();
  const clone = cloneView();
  addExportLegend(clone, prepareExportCanvas(clone));
  const data = new XMLSerializer().serializeToString(clone);
  const url = URL.createObjectURL(new Blob([data], { type: "image/svg+xml;charset=utf-8" }));
  const img = new Image();
  img.onload = () => {
    const scale = 2;
    const canvas = document.createElement("canvas");
    canvas.width = size.w * scale;
    canvas.height = size.h * scale;
    const ctx = canvas.getContext("2d");
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    URL.revokeObjectURL(url);
    canvas.toBlob((blob) => downloadBlob(blob, PREFIX + ".png"));
  };
  img.src = url;
}

function exportPDF() {
  // Match the on-screen SVG exactly: same aspect ratio and viewBox mapping.
  const size = viewSize();
  const pageW = size.w * 2, pageH = size.h * 2;
  const s = Math.min(pageW / W, pageH / H);
  const offX = (pageW - W * s) / 2;
  const offY = (pageH - H * s) / 2;
  const ops = [];
  const rgb = (hex) => {
    const h = hex.replace("#", "");
    return [parseInt(h.slice(0, 2), 16) / 255, parseInt(h.slice(2, 4), 16) / 255, parseInt(h.slice(4, 6), 16) / 255];
  };
  const setFill = (c) => ops.push(`${c[0].toFixed(4)} ${c[1].toFixed(4)} ${c[2].toFixed(4)} rg`);
  const setStroke = (c) => ops.push(`${c[0].toFixed(4)} ${c[1].toFixed(4)} ${c[2].toFixed(4)} RG`);
  const px = (x) => offX + (tx + k * x) * s;
  const py = (y) => pageH - (offY + (ty + k * y) * s);
  const BS = String.fromCharCode(92);
  const esc = (s) => s.split(BS).join(BS + BS).split("(").join(BS + "(").split(")").join(BS + ")");
  for (const e of edges) {
    const a = byId[e.s], b = byId[e.t];
    const x1 = px(a.x), y1 = py(a.y), x2 = px(b.x), y2 = py(b.y);
    setStroke([0.48, 0.48, 0.48]);
    ops.push(`${state.edgeWidth.toFixed(3)} w`);
    ops.push(`${x1.toFixed(2)} ${y1.toFixed(2)} m ${x2.toFixed(2)} ${y2.toFixed(2)} l S`);
    const s = String(e.w);
    setFill([0.2, 0.2, 0.2]);
    const tx = (x1 + x2) / 2 - 0.5 * state.edgeFont * s.length;
    ops.push(`BT /F1 ${state.edgeFont.toFixed(2)} Tf ${tx.toFixed(2)} ${((y1 + y2) / 2).toFixed(2)} Td (${esc(s)}) Tj ET`);
  }
  const bez = 0.5522847498;
  // Append the four bezier curves tracing a full circle (current path must be open).
  const circleCurves = (cx, cy, r) => {
    ops.push(`${(cx + r).toFixed(2)} ${cy.toFixed(2)} m`);
    ops.push(`${(cx + r).toFixed(2)} ${(cy + bez * r).toFixed(2)} ${(cx + bez * r).toFixed(2)} ${(cy + r).toFixed(2)} ${cx.toFixed(2)} ${(cy + r).toFixed(2)} c`);
    ops.push(`${(cx - bez * r).toFixed(2)} ${(cy + r).toFixed(2)} ${(cx - r).toFixed(2)} ${(cy + bez * r).toFixed(2)} ${(cx - r).toFixed(2)} ${cy.toFixed(2)} c`);
    ops.push(`${(cx - r).toFixed(2)} ${(cy - bez * r).toFixed(2)} ${(cx - bez * r).toFixed(2)} ${(cy - r).toFixed(2)} ${cx.toFixed(2)} ${(cy - r).toFixed(2)} c`);
    ops.push(`${(cx + bez * r).toFixed(2)} ${(cy - r).toFixed(2)} ${(cx + r).toFixed(2)} ${(cy - bez * r).toFixed(2)} ${(cx + r).toFixed(2)} ${cy.toFixed(2)} c`);
  };
  // Append a filled pie sector of radius r from graph angle a0 to a1 (y-down),
  // drawn with bezier arc segments of at most 90 degrees each.
  const wedgeFill = (cx, cy, r, a0, a1, color) => {
    setFill(color);
    // Graph angle a -> PDF point (cx + r cos a, cy - r sin a); with t = -a this
    // becomes a standard counter-clockwise arc from t = -a1 to t = -a0.
    let t = -a1;
    const tEnd = -a0;
    ops.push(`${cx.toFixed(2)} ${cy.toFixed(2)} m`);
    ops.push(`${(cx + r * Math.cos(t)).toFixed(2)} ${(cy + r * Math.sin(t)).toFixed(2)} l`);
    while (t < tEnd - 1e-9) {
      const d = Math.min(Math.PI / 2, tEnd - t);
      const kk = 4 / 3 * Math.tan(d / 4);
      const t1 = t + d;
      const x3 = cx + r * Math.cos(t1), y3 = cy + r * Math.sin(t1);
      ops.push(`${(cx + r * Math.cos(t) - kk * r * Math.sin(t)).toFixed(2)} ${(cy + r * Math.sin(t) + kk * r * Math.cos(t)).toFixed(2)} ${(x3 + kk * r * Math.sin(t1)).toFixed(2)} ${(y3 - kk * r * Math.cos(t1)).toFixed(2)} ${x3.toFixed(2)} ${y3.toFixed(2)} c`);
      t = t1;
    }
    ops.push("h f");
  };
  for (const n of nodes) {
    const cx = px(n.x), cy = py(n.y), r = n.r * k * s;
    setStroke([0, 0, 0]);
    ops.push("0.800 w");
    if (n.pie && n.pie.length > 1) {
      let a0 = -Math.PI / 2;
      for (const sl of n.pie) {
        const a1 = a0 + sl.frac * 2 * Math.PI;
        wedgeFill(cx, cy, r, a0, a1 - 1e-9, rgb(sl.color));
        a0 = a1;
      }
      circleCurves(cx, cy, r);
      ops.push("S");
    } else {
      setFill(rgb(n.color));
      circleCurves(cx, cy, r);
      ops.push("B");
    }
    const size = Math.max(7, Math.min(16, r * 0.5));
    setFill([0, 0, 0]);
    const tx = cx - 0.5 * size * n.label.length;
    ops.push(`BT /F1 ${size.toFixed(2)} Tf ${tx.toFixed(2)} ${cy.toFixed(2)} Td (${esc(n.label)}) Tj ET`);
  }
  // Legend card (matches the on-screen overlay) at the top-right of the page.
  if (legendEl.style.display !== "none") {
    const ld = legendData();
    if (ld) {
      const m = legendMetrics(ld);
      const lx = pageW - m.w * s - 16;
      const top = pageH - 16;                       // top edge in user space
      setFill([1, 1, 1]);
      ops.push(`${lx.toFixed(2)} ${(top - m.h * s).toFixed(2)} ${(m.w * s).toFixed(2)} ${(m.h * s).toFixed(2)} re f`);
      setStroke([0.73, 0.73, 0.73]);
      ops.push("0.800 w");
      ops.push(`${lx.toFixed(2)} ${(top - m.h * s).toFixed(2)} ${(m.w * s).toFixed(2)} ${(m.h * s).toFixed(2)} re S`);
      setFill([0.13, 0.13, 0.13]);
      ops.push(`BT /F1 14 Tf ${(lx + 12 * s).toFixed(2)} ${(top - 23 * s).toFixed(2)} Td (${esc(ld.title)}) Tj ET`);
      ld.rows.forEach((r, i) => {
        const cy = top - (31 + i * m.rowH) * s;     // swatch centre (user space)
        setFill(rgb(r.color));
        setStroke([0.33, 0.33, 0.33]);
        ops.push("0.600 w");
        circleCurves(lx + 18 * s, cy, 5.5 * s);
        ops.push("B");
        setFill([0.2, 0.2, 0.2]);
        ops.push(`BT /F1 12 Tf ${(lx + 30 * s).toFixed(2)} ${(cy - 4 * s).toFixed(2)} Td (${esc(r.label)}) Tj ET`);
      });
    }
  }
  const content = ops.join("\n");
  const enc = new TextEncoder();
  const contentBytes = enc.encode(content);
  const objs = [
    "<< /Type /Catalog /Pages 2 0 R >>",
    "<< /Type /Pages /Kids [3 0 R] /Count 1 >>",
    `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${pageW} ${pageH}] /Resources << /Font << /F1 4 0 R >> >> /Contents 5 0 R >>`,
    "<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>",
  ];
  const parts = [enc.encode("%PDF-1.4\n")];
  const offsets = [];
  let pos = parts[0].length;
  for (let i = 0; i < objs.length; i++) {
    offsets.push(pos);
    const b = enc.encode(`${i + 1} 0 obj\n${objs[i]}\nendobj\n`);
    parts.push(b); pos += b.length;
  }
  offsets.push(pos);
  const head = enc.encode(`5 0 obj\n<< /Length ${contentBytes.length} >>\nstream\n`);
  const tail = enc.encode("\nendstream\nendobj\n");
  parts.push(head); pos += head.length;
  parts.push(contentBytes); pos += contentBytes.length;
  parts.push(tail); pos += tail.length;
  const xrefPos = pos;
  let xref = `xref\n0 ${objs.length + 2}\n0000000000 65535 f \n`;
  for (const off of offsets) xref += `${String(off).padStart(10, "0")} 00000 n \n`;
  xref += `trailer\n<< /Size ${objs.length + 2} /Root 1 0 R >>\nstartxref\n${xrefPos}\n%%EOF\n`;
  parts.push(enc.encode(xref));
  let total = 0;
  for (const p of parts) total += p.length;
  const out = new Uint8Array(total);
  let o = 0;
  for (const p of parts) { out.set(p, o); o += p.length; }
  downloadBlob(new Blob([out], { type: "application/pdf" }), PREFIX + ".pdf");
}

// Standalone interactive HTML snapshot of the current view: same pan/zoom,
// colors/pies, hover tooltips and legend — plus the full metadata table
// embedded, so the recipient can re-color the tree by any metadata column
// (pie or mixed mode) directly in the exported file. No dependencies,
// works offline.
function exportHTML() {
  const clone = cloneView();
  clone.removeAttribute("width");
  clone.removeAttribute("height");
  clone.setAttribute("style", "width:100vw;height:100vh;display:block;background:#ffffff;cursor:grab;touch-action:none;");
  const gRootClone = clone.querySelector("g");
  gRootClone.id = "gRoot";
  const nodeGroups = gRootClone.children[1]
    ? Array.from(gRootClone.children[1].children).filter(el => el.tagName === "g")
    : [];
  // Native hover tooltips (also useful when no metadata is loaded).
  nodes.forEach((n, i) => {
    const grp = nodeGroups[i];
    if (!grp) return;
    grp.style.cursor = "default";
    const ttl = document.createElementNS(NS, "title");
    let txt = n.label + " — samples: " + n.count + "\n" +
      n.membersIdx.map(j => LABELS[j]).join(", ");
    if (n.metaCounts) {
      txt += "\n" + metaState.col + ": " +
        [...n.metaCounts.entries()].map(([cat, cnt]) => cat + " (" + cnt + ")").join(", ");
    }
    ttl.textContent = txt;
    grp.insertBefore(ttl, grp.firstChild);
  });
  const hasMeta = metaState.col && META.bySample.size > 0;
  // Embed everything the exported page needs to re-color nodes on its own.
  const embed = {
    labels: LABELS,
    columns: META.columns,
    meta: Object.fromEntries(META.bySample),
    color: { col: metaState.col, mode: metaState.mode, mixed: metaState.mixedColor },
    nodes: nodes.map(n => ({
      label: n.label, count: n.count, r: n.r,
      members: n.membersIdx,
    })),
  };
  const escTitle = (PREFIX + " — minimum spanning tree").replace(/&/g, "&amp;").replace(/</g, "&lt;");
  const escOpt = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");
  // Toolbar shown in the exported file (only when metadata is available).
  const colOptions = META.columns.map(c =>
    '<option value="' + escOpt(c) + '"' + (c === metaState.col ? " selected" : "") + ">" +
    escOpt(c) + "</option>").join("");
  const fontControls =
    '<label>Label size <input type="range" id="labelSize" min="0.3" max="3" step="0.1" value="1"></label>' +
    '<label>Edge font <input type="range" id="edgeFont" min="4" max="24" step="1" value="' + state.edgeFont + '"></label>';
  const toolbarHtml =
    '<div id="toolbar">' +
    (hasMeta
      ? '<label>Color by <select id="colorBy">' + colOptions + "</select></label>" +
        '<label>Node color <select id="colorMode">' +
        '<option value="pie"' + (metaState.mode === "pie" ? " selected" : "") + ">Pie chart</option>" +
        '<option value="mixed"' + (metaState.mode === "mixed" ? " selected" : "") + ">Mixed color</option>" +
        "</select></label>" +
        '<label>Mixed <input type="color" id="mixedColor" value="' + escOpt(metaState.mixedColor) + '"></label>' +
        '<button id="legendToggle">Legend</button>'
      : "") +
    fontControls + "</div>";
  const legendHtml = hasMeta ? '<div id="legend"><div id="legendItems"></div></div>' : "";
  const pageScript =
    "var EMBED=" + JSON.stringify(embed).replace(/</g, "\\u003c") + ";\n" +
    "var NS='http://www.w3.org/2000/svg',NA_COLOR='#d9d9d9';\n" +
    "var svg=document.querySelector('svg'),gRoot=document.getElementById('gRoot');\n" +
    // pan / zoom
    "var k=" + k + ",tx=" + tx + ",ty=" + ty + ",W=" + W + ",H=" + H + ";\n" +
    "function ap(){gRoot.setAttribute('transform','translate('+tx+','+ty+') scale('+k+')');}ap();\n" +
    "var pan=false,ps={x:0,y:0};\n" +
    "svg.addEventListener('wheel',function(e){e.preventDefault();" +
    "var pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;" +
    "var p=pt.matrixTransform(svg.getScreenCTM().inverse());" +
    "var f=e.deltaY<0?1.15:1/1.15;var nk=Math.max(0.01,Math.min(25,k*f));" +
    "tx=p.x-(p.x-tx)*(nk/k);ty=p.y-(p.y-ty)*(nk/k);k=nk;ap();},{passive:false});\n" +
    "svg.addEventListener('pointerdown',function(e){pan=true;ps={x:e.clientX,y:e.clientY};});\n" +
    "window.addEventListener('pointermove',function(e){if(!pan)return;" +
    "var r=svg.getBoundingClientRect();" +
    "tx+=(e.clientX-ps.x)/r.width*W;ty+=(e.clientY-ps.y)/r.height*H;" +
    "ps={x:e.clientX,y:e.clientY};ap();});\n" +
    "window.addEventListener('pointerup',function(){pan=false;});\n" +
    // color helpers (same palette rules as TreeWeaver)
    "function hsv(h,s,v){var c=v*s,x=c*(1-Math.abs((h*6)%2-1)),m=v-c,hh=Math.floor(h*6)%6,r,g,b;" +
    "if(hh===0){r=c;g=x;b=0;}else if(hh===1){r=x;g=c;b=0;}else if(hh===2){r=0;g=c;b=x;}" +
    "else if(hh===3){r=0;g=x;b=c;}else if(hh===4){r=x;g=0;b=c;}else{r=c;g=0;b=x;}" +
    "var t=function(q){return Math.round((q+m)*255).toString(16).padStart(2,'0');};" +
    "return '#'+t(r)+t(g)+t(b);}\n" +
    "function palette(n){var out=[];for(var i=0;i<n;i++){" +
    "out.push(hsv((i*0.618033988749895)%1,0.55+0.25*((i%3)/2),0.85-0.15*(i%2)));}return out;}\n" +
    "var nodeGroups=Array.prototype.filter.call(gRoot.children[1].children,function(el){return el.tagName==='g';});\n" +
    "function catVal(lab,col){var rec=EMBED.meta[lab];" +
    "return (rec&&rec[col]!==''&&rec[col]!=null)?String(rec[col]):'(no data)';}\n" +
    "function wedge(r,a0,a1,color){" +
    "var x0=r*Math.cos(a0),y0=r*Math.sin(a0),x1=r*Math.cos(a1),y1=r*Math.sin(a1);" +
    "var p=document.createElementNS(NS,'path');" +
    "p.setAttribute('d','M0 0 L'+x0.toFixed(3)+' '+y0.toFixed(3)+' A'+r+' '+r+' 0 '+((a1-a0)>Math.PI?1:0)+' 1 '+x1.toFixed(3)+' '+y1.toFixed(3)+' Z');" +
    "p.setAttribute('fill',color);return p;}\n" +
    "function applyColors(){\n" +
    "var colEl=document.getElementById('colorBy');if(!colEl)return;\n" +
    "var col=colEl.value,mode=document.getElementById('colorMode').value," +
    "mixed=document.getElementById('mixedColor').value;\n" +
    // category colors in first-appearance order over the sample labels
    "var cats=[],seen={};EMBED.labels.forEach(function(lab){var v=catVal(lab,col);" +
    "if(v!=='(no data)'&&!seen[v]){seen[v]=1;cats.push(v);}});\n" +
    "var pal=palette(cats.length),catColor={};cats.forEach(function(c,i){catColor[c]=pal[i];});\n" +
    "var cc=function(c){return c==='(no data)'?NA_COLOR:catColor[c];};\n" +
    // re-draw every node group: title tooltip + solid fill or pie wedges
    "EMBED.nodes.forEach(function(n,i){var grp=nodeGroups[i];if(!grp)return;\n" +
    "while(grp.firstChild)grp.removeChild(grp.firstChild);\n" +
    "var counts={},order=[];n.members.forEach(function(j){var c=catVal(EMBED.labels[j],col);" +
    "if(!counts[c]){counts[c]=0;order.push(c);}counts[c]++;});\n" +
    "order.sort(function(a,b){return counts[b]-counts[a]||(a<b?-1:1);});\n" +
    "var ttl=document.createElementNS(NS,'title');" +
    "ttl.textContent=n.label+' -- samples: '+n.count+'\\n'+" +
    "n.members.map(function(j){return EMBED.labels[j];}).join(', ')+'\\n'+col+': '+" +
    "order.map(function(c){return c+' ('+counts[c]+')';}).join(', ');" +
    "grp.appendChild(ttl);\n" +
    "var circle=document.createElementNS(NS,'circle');circle.setAttribute('r',n.r);" +
    "circle.setAttribute('stroke','black');circle.setAttribute('stroke-width','0.8');\n" +
    "if(order.length===1){circle.setAttribute('fill',cc(order[0]));grp.appendChild(circle);}\n" +
    "else if(mode==='pie'){var a0=-Math.PI/2;order.forEach(function(c){" +
    "var a1=a0+(counts[c]/n.count)*2*Math.PI;" +
    "grp.appendChild(wedge(n.r,a0,a1-1e-9,cc(c)));a0=a1;});" +
    "circle.setAttribute('fill','none');grp.appendChild(circle);}\n" +
    "else{circle.setAttribute('fill',mixed);grp.appendChild(circle);}\n" +
    "});\n" +
    // rebuild legend
    "var li=document.getElementById('legendItems');" +
    "li.innerHTML='';" +
    "var t=document.createElement('div');t.style.fontWeight='bold';t.textContent=col;li.appendChild(t);\n" +
    "var totals={};EMBED.labels.forEach(function(lab){var v=catVal(lab,col);" +
    "totals[v]=(totals[v]||0)+1;});\n" +
    "Object.keys(totals).sort(function(a,b){return totals[b]-totals[a]||(a<b?-1:1);})" +
    ".forEach(function(c){var row=document.createElement('div');" +
    "row.innerHTML='<span class=\"swatch\" style=\"background:'+cc(c)+'\"></span><span>'+c+" +
    "'</span><span class=\"count\">('+totals[c]+')</span>';li.appendChild(row);});\n" +
    "if(mode==='mixed'){var row=document.createElement('div');" +
    "row.innerHTML='<span class=\"swatch\" style=\"background:'+mixed+'\"></span><span>(mixed)</span>';" +
    "li.appendChild(row);}\n" +
    "}\n" +
    // font-size controls: scale node labels relative to the exported view,
    // set edge labels in absolute px
    "var edgeTexts=Array.prototype.filter.call(gRoot.children[0].children,function(el){return el.tagName==='text';});\n" +
    "var nodeTexts=Array.prototype.filter.call(gRoot.children[1].children,function(el){return el.tagName==='text';});\n" +
    "var nBase=nodeTexts.map(function(t){return parseFloat(t.getAttribute('font-size'));});\n" +
    "document.getElementById('labelSize').oninput=function(){var v=parseFloat(this.value);" +
    "nodeTexts.forEach(function(t,i){t.setAttribute('font-size',nBase[i]*v);});};\n" +
    "document.getElementById('edgeFont').oninput=function(){var v=parseFloat(this.value);" +
    "edgeTexts.forEach(function(t){t.setAttribute('font-size',v);});};\n" +
    "var cb=document.getElementById('colorBy');\n" +
    "if(cb){cb.onchange=applyColors;\n" +
    "document.getElementById('colorMode').onchange=applyColors;\n" +
    "document.getElementById('mixedColor').oninput=applyColors;\n" +
    "var lg=document.getElementById('legend'),lb=document.getElementById('legendToggle');\n" +
    "lb.onclick=function(){lg.style.display=lg.style.display==='none'?'block':'none';};\n" +
    "applyColors();}\n";
  const htmlDoc =
    "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n" +
    "<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n" +
    "<title>" + escTitle + "</title>\n<style>\n" +
    "html,body{margin:0;height:100%;font-family:-apple-system,Segoe UI,Roboto,sans-serif;}\n" +
    "#toolbar{position:fixed;top:10px;left:10px;z-index:10;display:flex;gap:8px;align-items:center;flex-wrap:wrap;}\n" +
    "#toolbar label{font-size:12px;color:#333;display:flex;align-items:center;gap:4px;" +
    "background:rgba(255,255,255,0.92);padding:3px 8px;border-radius:5px;border:1px solid #ddd;}\n" +
    "#toolbar select{font-size:12px;padding:3px 4px;border:1px solid #ccc;border-radius:4px;background:#fff;color:#333;}\n" +
    "#toolbar button{font-size:13px;padding:5px 10px;border:1px solid #bbb;border-radius:5px;background:#f7f7f7;cursor:pointer;}\n" +
    "#toolbar input[type=color]{width:26px;height:20px;padding:0;border:1px solid #bbb;border-radius:4px;background:#fff;cursor:pointer;}\n" +
    "#legend{position:fixed;top:52px;right:10px;z-index:10;background:rgba(255,255,255,0.95);" +
    "border:1px solid #bbb;border-radius:6px;padding:6px 10px;font-size:12px;max-width:280px;" +
    "max-height:80vh;overflow-y:auto;box-shadow:0 2px 6px rgba(0,0,0,0.15);}\n" +
    "#legend #legendItems div{display:flex;align-items:center;gap:6px;padding:1px 0;}\n" +
    "#legend .swatch{width:12px;height:12px;border-radius:50%;border:1px solid #555;flex:none;display:inline-block;}\n" +
    "#legend .count{color:#888;font-size:11px;}\n" +
    "#hint{position:fixed;bottom:10px;left:10px;font-size:12px;color:#666;}\n" +
    "</style>\n</head>\n<body>\n" +
    toolbarHtml + "\n" + legendHtml + "\n" +
    clone.outerHTML + "\n" +
    '<div id="hint">' + escTitle + " &middot; scroll to zoom &middot; drag to pan &middot; hover a node for details</div>\n" +
    "<scr" + "ipt>" + pageScript + "</scr" + "ipt>\n</body>\n</html>\n";
  downloadBlob(new Blob([htmlDoc], { type: "text/html" }), PREFIX + ".html");
}

document.getElementById("export").onclick = () => {
  const fmt = document.getElementById("exportFormat").value;
  if (fmt === "png") exportPNG();
  else if (fmt === "pdf") exportPDF();
  else if (fmt === "html") exportHTML();
  else exportSVG();
};

document.getElementById("zin").onclick = () => { k = Math.min(25, k * 1.2); applyTransform(); };
document.getElementById("zout").onclick = () => { k = Math.max(0.01, k / 1.2); applyTransform(); };
document.getElementById("fit").onclick = () => {
  const xs = nodes.map(n => n.x);
  const ys = nodes.map(n => n.y);
  const minX = Math.min(...xs), maxX = Math.max(...xs);
  const minY = Math.min(...ys), maxY = Math.max(...ys);
  const pad = 60;
  const w = (maxX - minX) || 1;
  const h = (maxY - minY) || 1;
  k = Math.min((W - 2 * pad) / w, (H - 2 * pad) / h);
  tx = pad - minX * k + ((W - 2 * pad) - w * k) / 2;
  ty = pad - minY * k + ((H - 2 * pad) - h * k) / 2;
  applyTransform();
};

const repulsionInput = document.getElementById("repulsion");
repulsionInput.oninput = () => {
  state.repulsion = parseFloat(repulsionInput.value);
  document.getElementById("repulsionVal").textContent = state.repulsion.toFixed(1);
};
const attractionInput = document.getElementById("attraction");
attractionInput.oninput = () => {
  state.attraction = parseFloat(attractionInput.value);
  document.getElementById("attractionVal").textContent = state.attraction.toFixed(1);
};
const speedInput = document.getElementById("speed");
speedInput.oninput = () => {
  state.speed = parseInt(speedInput.value, 10);
  document.getElementById("speedVal").textContent = String(state.speed);
};

const labelScaleInput = document.getElementById("labelScale");
labelScaleInput.oninput = () => {
  state.labelScale = parseFloat(labelScaleInput.value);
  document.getElementById("labelScaleVal").textContent = state.labelScale.toFixed(1);
  applyStyle();
};
const nodeScaleInput = document.getElementById("nodeScale");
nodeScaleInput.oninput = () => {
  state.nodeScale = parseFloat(nodeScaleInput.value);
  document.getElementById("nodeScaleVal").textContent = state.nodeScale.toFixed(1);
  if (!nodes.length) return;
  // Re-scale every node around its base radius and re-render, so circles,
  // pie wedges and label fonts update live.
  nodes.forEach(n => { n.r = n.rBase * state.nodeScale; });
  render();
};
const edgeFontInput = document.getElementById("edgeFont");
edgeFontInput.oninput = () => {
  state.edgeFont = parseFloat(edgeFontInput.value);
  document.getElementById("edgeFontVal").textContent = String(state.edgeFont);
  applyStyle();
};
const edgeWidthInput = document.getElementById("edgeWidth");
edgeWidthInput.oninput = () => {
  state.edgeWidth = parseFloat(edgeWidthInput.value);
  document.getElementById("edgeWidthVal").textContent = state.edgeWidth.toFixed(1);
  applyStyle();
};

const mstSelect = document.getElementById("mstAlgo");
mstSelect.value = state.mstAlgo;
mstSelect.onchange = () => { state.mstAlgo = mstSelect.value; rebuild(); };

const collapseSelect = document.getElementById("collapse");
collapseSelect.value = String(state.collapse);
collapseSelect.onchange = () => { state.collapse = parseFloat(collapseSelect.value); rebuild(); };

const layoutSelect = document.getElementById("layoutMode");
layoutSelect.value = state.layoutMode;
layoutSelect.onchange = () => { state.layoutMode = layoutSelect.value; rebuild(); };

function rebuild() {
  playing = false;
  playButton.textContent = "▶ Play";
  playButton.classList.remove("active");
  buildGraph();
  computeSnpMean();
  buildLegend();
  k = 1; tx = 0; ty = 0;
  applyTransform();
}

// ---- legend ----
const legendEl = document.getElementById("legend");
const legendItems = document.getElementById("legendItems");
const legendToggleBtn = document.getElementById("legendToggle");

function buildLegend() {
  if (!metaState.col || META.bySample.size === 0) {
    legendEl.style.display = "none";
    legendToggleBtn.style.display = "none";
    return;
  }
  legendToggleBtn.style.display = "";
  // Total sample counts per category across the whole dataset.
  const totals = new Map();
  for (let i = 0; i < N; i++) {
    const rec = META.bySample.get(LABELS[i]);
    const v = (rec && rec[metaState.col] !== "" && rec[metaState.col] != null) ? rec[metaState.col] : "(no data)";
    totals.set(v, (totals.get(v) || 0) + 1);
  }
  const rows = [...totals.entries()].sort((a, b) => b[1] - a[1] || (a[0] < b[0] ? -1 : 1));
  legendItems.innerHTML = "";
  const title = document.createElement("div");
  title.style.fontWeight = "bold";
  title.textContent = metaState.col;
  legendItems.appendChild(title);
  for (const [cat, cnt] of rows) {
    const color = cat === "(no data)" ? NA_COLOR : catColors.get(cat);
    const row = document.createElement("div");
    row.innerHTML = `<span class="swatch" style="background:${color}"></span><span>${cat}</span><span class="count">(${cnt})</span>`;
    legendItems.appendChild(row);
  }
  if (metaState.mode === "mixed") {
    const row = document.createElement("div");
    row.innerHTML = `<span class="swatch" style="background:${metaState.mixedColor}"></span><span>(mixed)</span>`;
    legendItems.appendChild(row);
  }
  legendEl.style.display = "block";
}

legendToggleBtn.onclick = () => {
  legendEl.style.display = legendEl.style.display === "none" ? "block" : "none";
};
document.getElementById("legendHeader").onclick = () => { legendEl.style.display = "none"; };

// ---- metadata controls ----
const metaColSelect = document.getElementById("metaCol");
const metaModeSelect = document.getElementById("metaMode");
const mixedColorInput = document.getElementById("mixedColor");

function refreshMetaColors() {
  computeCategoryColors();
  computeNodeColors();
  buildLegend();
  if (nodes.length) render();
}

document.getElementById("metaFile").onchange = ev => {
  const file = ev.target.files && ev.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const parsed = parseMetadata(String(reader.result));
      META.columns = parsed.columns;
      META.bySample = parsed.bySample;
      metaColSelect.innerHTML = "";
      for (const col of META.columns) {
        const opt = document.createElement("option");
        opt.value = col; opt.textContent = col;
        metaColSelect.appendChild(opt);
      }
      metaState.col = META.columns[0];
      metaColSelect.value = metaState.col;
      refreshMetaColors();
      const matched = LABELS.filter(l => META.bySample.has(l)).length;
      document.getElementById("hint").textContent =
        `Loaded metadata for ${META.bySample.size} samples from ${file.name} (${matched} matched the matrix)`;
    } catch (err) {
      alert("Could not parse the metadata table: " + err.message);
    }
  };
  reader.readAsText(file);
};

metaColSelect.onchange = () => { metaState.col = metaColSelect.value; refreshMetaColors(); };
metaModeSelect.onchange = () => { metaState.mode = metaModeSelect.value; refreshMetaColors(); };
mixedColorInput.oninput = () => { metaState.mixedColor = mixedColorInput.value; refreshMetaColors(); };

// ---- matrix upload ----
function parseMatrix(text) {
  const lines = text.split(/\r?\n/).filter(l => l.trim() !== "");
  if (lines.length < 2) throw new Error("matrix has too few lines");
  const header = lines[0].split("	");
  const labels = header.slice(1).map(s => s.trim());
  const n = labels.length;
  const matrix = new Array(n * n).fill(0);
  for (let r = 0; r < n; r++) {
    const fields = lines[r + 1].split("	");
    for (let c = 0; c < n; c++) {
      const v = parseFloat(fields[c + 1]);
      matrix[r * n + c] = Number.isFinite(v) ? v : 0;
    }
  }
  return { n, labels, matrix };
}

document.getElementById("matrixFile").onchange = ev => {
  const file = ev.target.files && ev.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const parsed = parseMatrix(String(reader.result));
      N = parsed.n;
      LABELS = parsed.labels;
      MATRIX = parsed.matrix;
      PREFIX = (file.name || "mst").replace(/\.[^.]+$/, "");
      state.collapse = 0;
      collapseSelect.value = "0";
      rebuild();
      startPlay();
      document.getElementById("hint").textContent =
        "Loaded " + N + " samples from " + file.name + " - press Play to relax the layout";
    } catch (err) {
      alert("Could not parse the matrix: " + err.message);
    }
  };
  reader.readAsText(file);
};

// ---- go ----
if (N > 0) {
  buildGraph();
  computeSnpMean();
  startPlay();
} else {
  document.getElementById("hint").textContent =
    "Upload a distance matrix (TSV: first row and column are sample names) to build the MST";
}
</script>
